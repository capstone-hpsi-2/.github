# Source: capstone-hpsi-2/.github agents/workflows/agents.yml, the same in every repo.
# check: PRs and pushes to main fail if a generated agent file (list: "Generated files" in
# AGENTS.md) differs from the pinned .github commit. The agent hooks refuse such edits up front;
# this is the backstop for edits made outside an agent.
# sync: adopt the newest capstone-hpsi-2/.github agents/ through one PR on chore/sync-agents.
# .github sends the agents-changed dispatch when agents/ changes on its main; a push to this
# repo's main rebuilds the PR on the new base; the daily run catches a lost dispatch.
#
# The PR is pushed with the SYNC_TOKEN secret (a member's fine-grained PAT), so CI runs on it and
# it may include this file. Without the secret the job falls back to GITHUB_TOKEN: the PR then
# leaves this file out and runs no CI until closed and reopened.
name: agents

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [agents-changed]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin
        id: pin
        run: |
          if grep -q '"sha": "BOOTSTRAP"' agents.lock.json; then echo bootstrap=true >> "$GITHUB_OUTPUT"; fi
      # Until the .github PR merges there is no pinned upstream to fetch, so only the parts
      # checkable inside this repo are checked. The mode test matters here because the sync,
      # which would commit the bit, does not run during BOOTSTRAP.
      - name: Mirror, CLAUDE.md and guard mode (BOOTSTRAP only)
        if: steps.pin.outputs.bootstrap == 'true'
        run: |
          diff -r .agents/skills .claude/skills
          test "$(sed '/^[[:space:]]*$/d' CLAUDE.md)" = "@AGENTS.md"
          test ! -e GEMINI.md
          git ls-files -s scripts/agents-guard.sh | grep -q '^100755' \
            || { echo "scripts/agents-guard.sh needs mode 100755: git add --chmod=+x scripts/agents-guard.sh"; exit 1; }
      - name: Agent files match the pinned .github commit
        if: steps.pin.outputs.bootstrap != 'true'
        run: bash scripts/sync-agents.sh --check
      - name: How to fix
        if: failure()
        run: echo "Generated agent files changed by hand. See the lines above and 'Generated files' in AGENTS.md (skill agents-md-placement)."

  sync:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # A dispatch and a merge to main close together would both push chore/sync-agents. Queued, not
    # cancelled: every run rebuilds the branch from the current main and the newest .github, so
    # the last one to finish is always right.
    concurrency:
      group: agents-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A queued push run would otherwise check out its own, possibly older, sha and base the PR
      # on it; the branch must be rebuilt from main as it is when the run starts.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read the pin
        id: pin
        run: |
          if grep -q '"sha": "BOOTSTRAP"' agents.lock.json; then
            echo bootstrap=true >> "$GITHUB_OUTPUT"
            echo "agents.lock.json is BOOTSTRAP: nothing on .github main to sync from yet."
          fi
      - name: Pick the token
        id: token
        env:
          HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          if [ "$HAS_SYNC_TOKEN" = true ]; then
            echo workflow=1 >> "$GITHUB_OUTPUT"
            echo "Using SYNC_TOKEN: the PR runs CI and may update .github/workflows/agents.yml."
          else
            echo "::warning::SYNC_TOKEN secret is not set. Falling back to GITHUB_TOKEN: the PR leaves .github/workflows/agents.yml out and runs no CI until closed and reopened."
          fi
      - name: Sync from .github main
        if: steps.pin.outputs.bootstrap != 'true'
        env:
          AGENTS_SYNC_WORKFLOW: ${{ steps.token.outputs.workflow }}
        run: |
          bash scripts/sync-agents.sh --latest
          # .github main also moves for templates and workflows. A new sha with no file changes
          # would rewrite the PR on every run, so the old pin is kept until agents/ really changes.
          if [ -z "$(git status --porcelain -- . ':!agents.lock.json')" ]; then
            git checkout -- agents.lock.json
            echo "No agent file changed; keeping the current pin."
          fi
      # The PR's own CI runs the same check, but only with SYNC_TOKEN. Checking here keeps a
      # broken sync out of the PR either way.
      - name: Check the result
        if: steps.pin.outputs.bootstrap != 'true'
        run: bash scripts/sync-agents.sh --check
      # With no changes against main the action opens nothing and deletes the branch, which closes
      # a stale PR; an open PR on the branch is updated in place. It pushes only to
      # chore/sync-agents, never to main. The GITHUB_TOKEN fallback also needs the org and repo
      # setting "Allow GitHub Actions to create and approve pull requests".
      - name: Open or update the sync PR
        if: steps.pin.outputs.bootstrap != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/sync-agents
          base: main
          delete-branch: true
          commit-message: |
            agents: sync shared rules and skills from capstone-hpsi-2/.github

            Generated by the agents workflow (scripts/sync-agents.sh --latest).
          title: "agents: sync shared rules and skills from .github"
          body: |
            Generated by the `agents` workflow: `scripts/sync-agents.sh --latest`, then `--check` passed in the same run.

            Review the diff like any PR; the source change was already reviewed in `capstone-hpsi-2/.github`. If `github-actions[bot]` opened this PR, the repo has no `SYNC_TOKEN` secret and CI did not run: close and reopen it before merging.

            Do not push to this branch: the next run rebuilds it from `main`.
