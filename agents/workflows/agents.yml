# Source: capstone-hpsi-2/.github agents/workflows/agents.yml, the same in every repo.
# check: PRs and pushes to main fail if a generated agent file (list: "Generated files" in
# AGENTS.md) differs from the pinned .github commit. The agent hooks refuse such edits up front;
# this is the backstop for edits made outside an agent.
# sync: daily, adopt the newest capstone-hpsi-2/.github agents/ through one PR.
#
# scripts/sync-agents.sh copies this file only when run on a machine, never in this workflow:
# GITHUB_TOKEN may not push changes to workflow files, so the sync PR would fail to push.
name: agents

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin
        id: pin
        run: |
          if grep -q '"sha": "BOOTSTRAP"' agents.lock.json; then echo bootstrap=true >> "$GITHUB_OUTPUT"; fi
      # Until the .github PR merges there is no pinned upstream to fetch, so only the parts
      # checkable inside this repo are checked. The mode test matters here because the daily
      # sync, which would commit the bit, does not run during BOOTSTRAP.
      - name: Mirror, CLAUDE.md and guard mode (BOOTSTRAP only)
        if: steps.pin.outputs.bootstrap == 'true'
        run: |
          diff -r .agents/skills .claude/skills
          test "$(sed '/^[[:space:]]*$/d' CLAUDE.md)" = "@AGENTS.md"
          test ! -e GEMINI.md
          git ls-files -s scripts/agents-guard.sh | grep -q '^100755' \
            || { echo "scripts/agents-guard.sh needs mode 100755: git add --chmod=+x scripts/agents-guard.sh"; exit 1; }
      - name: Agent files match the pinned .github commit
        if: steps.pin.outputs.bootstrap != 'true'
        run: bash scripts/sync-agents.sh --check
      - name: How to fix
        if: failure()
        run: echo "Generated agent files changed by hand. See the lines above and 'Generated files' in AGENTS.md (skill agents-md-placement)."

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A scheduled and a manual run at once would both push chore/sync-agents.
    concurrency:
      group: agents-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin
        id: pin
        run: |
          if grep -q '"sha": "BOOTSTRAP"' agents.lock.json; then
            echo bootstrap=true >> "$GITHUB_OUTPUT"
            echo "agents.lock.json is BOOTSTRAP: nothing on .github main to sync from yet."
          fi
      - name: Sync from .github main
        if: steps.pin.outputs.bootstrap != 'true'
        run: |
          bash scripts/sync-agents.sh --latest
          # .github main also moves for templates and workflows. A new sha with no file changes
          # would open a PR every day, so the old pin is kept until agents/ really changes.
          if [ -z "$(git status --porcelain -- . ':!agents.lock.json')" ]; then
            git checkout -- agents.lock.json
            echo "No agent file changed; keeping the current pin."
          fi
      # A PR opened with GITHUB_TOKEN does not trigger pull_request workflows, so the check job
      # never runs on it. Checking here is what keeps a broken sync out of the PR.
      - name: Check the result
        if: steps.pin.outputs.bootstrap != 'true'
        run: bash scripts/sync-agents.sh --check
      # Needs the org (and repo) setting "Allow GitHub Actions to create and approve pull
      # requests". With no changes against main the action opens nothing; an open PR on the
      # branch is updated in place. It pushes only to chore/sync-agents, never to main.
      - name: Open or update the sync PR
        if: steps.pin.outputs.bootstrap != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-agents
          base: main
          delete-branch: true
          commit-message: |
            agents: sync shared rules and skills from capstone-hpsi-2/.github

            Generated by the daily agents workflow (scripts/sync-agents.sh --latest).
          title: "agents: sync shared rules and skills from .github"
          body: |
            Generated by the daily `agents` workflow: `scripts/sync-agents.sh --latest`, then `--check` passed in the same run.

            Review the diff like any PR; the source change was already reviewed in `capstone-hpsi-2/.github`. GitHub does not run CI on PRs opened by `GITHUB_TOKEN`: close and reopen this PR to run it before merging.

            Do not push to this branch: the next run overwrites it.
